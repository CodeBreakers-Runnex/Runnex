<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{width:540px;height:960px;position:relative;overflow:hidden;font-family:Inter,sans-serif}
svg{display:block}
.cap{position:absolute;left:0;right:0;text-align:center;font-family:'Inter';font-weight:900;font-size:40px;line-height:1.05;letter-spacing:.5px;color:#fff;
 -webkit-text-stroke:9px #111;paint-order:stroke fill;text-transform:uppercase;padding:0 24px}
.cap span{display:inline-block;margin:0 6px}
</style></head>
<body><div id="stage"><div id="scene"></div><div id="cap" class="cap"></div></div>
<script>
const W=540,H=960;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const io=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const out=t=>1-Math.pow(1-t,3);
const back=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const K='#111', SK='#C98A5B', SKD='#A86F45', HAIR='#2A1A12', PUR='#9B4DFF', PURD='#6E22D9', PINK='#FF4FA3', YEL='#FFD23F', RED='#FF3B3B';

/* ---------- BETO HEAD (origin = face center, ~220 wide) ---------- */
function heart(x,y,s,fill){return `<path transform="translate(${x},${y}) scale(${s})" d="M0,8 C-14,-6 -26,4 -18,16 L0,32 L18,16 C26,4 14,-6 0,8Z" fill="${fill}" stroke="${K}" stroke-width="${4/s}"/>`}
function head(o){
  const {x=0,y=0,s=1,eyes='normal',mouth='smile',sweat=0,brow='normal',t=0,glow=0,look=0,blink=0}=o;
  let g=`<g transform="translate(${x},${y}) scale(${s})">`;
  // hood/neck
  g+=`<path d="M-120,190 Q-110,95 -40,92 L40,92 Q110,95 120,190Z" fill="#8A909B" stroke="${K}" stroke-width="6"/>`;
  g+=`<rect x="-28" y="70" width="56" height="40" fill="${SKD}" stroke="${K}" stroke-width="6"/>`;
  // afro back
  [[-82,-62,46],[-48,-105,48],[0,-122,50],[48,-105,48],[82,-62,46],[-100,-18,38],[100,-18,38]].forEach(c=>g+=`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="${HAIR}" stroke="${K}" stroke-width="6"/>`);
  // ears
  g+=`<circle cx="-92" cy="12" r="20" fill="${SK}" stroke="${K}" stroke-width="6"/><circle cx="92" cy="12" r="20" fill="${SK}" stroke="${K}" stroke-width="6"/>`;
  // face
  g+=`<ellipse cx="0" cy="8" rx="92" ry="104" fill="${SK}" stroke="${K}" stroke-width="6"/>`;
  if(glow) g+=`<ellipse cx="0" cy="20" rx="88" ry="96" fill="#7FB3FF" opacity="${0.28*glow}"/>`;
  // stubble
  for(let i=0;i<14;i++){const a=Math.PI*(0.15+0.7*i/13);g+=`<circle cx="${Math.cos(a)*70}" cy="${40+Math.sin(a)*58}" r="2.2" fill="${SKD}"/>`}
  // fringe
  [[-50,-84,30],[-10,-94,32],[34,-88,30],[66,-66,22]].forEach(c=>g+=`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="${HAIR}"/>`);
  // eyes
  const ex=[-38,38], ey=6;
  ex.forEach((cx,i)=>{
    if(eyes==='heart'){const p=1+0.18*Math.sin(t*14);g+=heart(cx,ey-14,1.15*p,RED);}
    else{
      const r=eyes==='wide'?26:20, pr=eyes==='wide'?6:9;
      g+=`<circle cx="${cx}" cy="${ey}" r="${r}" fill="#fff" stroke="${K}" stroke-width="4"/>`;
      if(blink>0.5) g+=`<rect x="${cx-r-2}" y="${ey-r-2}" width="${2*r+4}" height="${2*r+4}" fill="${SK}"/><path d="M${cx-r},${ey} L${cx+r},${ey}" stroke="${K}" stroke-width="5"/>`;
      else g+=`<circle cx="${cx+look*8}" cy="${ey+(eyes==='wide'?0:2)}" r="${pr}" fill="${K}"/><circle cx="${cx+look*8+3}" cy="${ey-2}" r="2.5" fill="#fff"/>`;
      if(eyes==='determined') g+=`<path d="M${cx-24},${ey-24} L${cx+24},${ey-24} L${cx+24},${ey+(i?-12:-2)} L${cx-24},${ey+(i?-2:-12)}Z" fill="${SK}" stroke="${K}" stroke-width="4"/>`;
    }
  });
  // glasses
  g+=`<circle cx="-38" cy="6" r="32" fill="rgba(255,255,255,.12)" stroke="${K}" stroke-width="6"/><circle cx="38" cy="6" r="32" fill="rgba(255,255,255,.12)" stroke="${K}" stroke-width="6"/><path d="M-8,4 Q0,-2 8,4" stroke="${K}" stroke-width="6" fill="none"/><path d="M-70,0 L-88,-4 M70,0 L88,-4" stroke="${K}" stroke-width="6"/>`;
  // brows
  const by=-38;
  if(brow==='angry') g+=`<path d="M-66,${by-10} L-14,${by+6}" stroke="${K}" stroke-width="10" stroke-linecap="round"/><path d="M66,${by-10} L14,${by+6}" stroke="${K}" stroke-width="10" stroke-linecap="round"/>`;
  else if(brow==='up') g+=`<path d="M-64,${by-4} Q-40,${by-26} -16,${by-12}" stroke="${K}" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M64,${by-4} Q40,${by-26} 16,${by-12}" stroke="${K}" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  else g+=`<path d="M-62,${by} Q-40,${by-10} -18,${by-2}" stroke="${K}" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M62,${by} Q40,${by-10} 18,${by-2}" stroke="${K}" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  // nose
  g+=`<path d="M-6,30 Q0,44 10,36" stroke="${K}" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  // mouth
  if(mouth==='open') g+=`<path d="M-34,58 Q0,50 34,58 Q30,104 0,106 Q-30,104 -34,58Z" fill="#7A1020" stroke="${K}" stroke-width="6"/><path d="M-26,64 L26,64 L22,72 L-22,72Z" fill="#fff"/><ellipse cx="0" cy="94" rx="18" ry="9" fill="${PINK}"/>`;
  else if(mouth==='flat') g+=`<path d="M-24,66 Q0,62 24,66" stroke="${K}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  else if(mouth==='grin') g+=`<path d="M-36,56 Q0,96 36,56Z" fill="#fff" stroke="${K}" stroke-width="6" stroke-linejoin="round"/>`;
  else if(mouth==='dreamy') g+=`<path d="M-30,58 Q0,86 30,58" stroke="${K}" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="-62" cy="44" rx="14" ry="8" fill="${PINK}" opacity=".6"/><ellipse cx="62" cy="44" rx="14" ry="8" fill="${PINK}" opacity=".6"/>`;
  else g+=`<path d="M-28,60 Q0,80 28,60" stroke="${K}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  // sweat
  if(sweat>0){const sy=-50+sweat*70;g+=`<path transform="translate(96,${sy})" d="M0,-22 Q16,4 0,14 Q-16,4 0,-22Z" fill="#59C3FF" stroke="${K}" stroke-width="4"/>`;}
  return g+`</g>`;
}

/* ---------- BETO FULL BODY (origin = feet center, ~ 300 tall at s=1) ---------- */
function body(o){
  const {x,y,s=1,rot=0,headOpt={},arms='down',t=0}=o;
  let g=`<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">`;
  // legs
  g+=`<rect x="-34" y="-90" width="26" height="80" rx="10" fill="${SK}" stroke="${K}" stroke-width="5"/><rect x="8" y="-90" width="26" height="80" rx="10" fill="${SK}" stroke="${K}" stroke-width="5"/>`;
  g+=`<ellipse cx="-24" cy="-6" rx="24" ry="9" fill="#2F7BFF" stroke="${K}" stroke-width="5"/><ellipse cx="24" cy="-6" rx="24" ry="9" fill="#2F7BFF" stroke="${K}" stroke-width="5"/>`;
  // shorts
  g+=`<path d="M-50,-140 L50,-140 L48,-82 L4,-82 L0,-100 L-4,-82 L-48,-82Z" fill="#3B5BA9" stroke="${K}" stroke-width="5" stroke-linejoin="round"/>`;
  // arms
  const ar = arms==='up'? `<path d="M-62,-230 Q-110,-300 -96,-330" stroke="#8A909B" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M62,-230 Q110,-300 96,-330" stroke="#8A909B" stroke-width="30" fill="none" stroke-linecap="round"/><circle cx="-96" cy="-336" r="15" fill="${SK}" stroke="${K}" stroke-width="5"/><circle cx="96" cy="-336" r="15" fill="${SK}" stroke="${K}" stroke-width="5"/>`
   : arms==='hips'? `<path d="M-64,-230 Q-110,-190 -60,-160" stroke="#8A909B" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M64,-230 Q110,-190 60,-160" stroke="#8A909B" stroke-width="30" fill="none" stroke-linecap="round"/>`
   : `<path d="M-64,-230 Q-84,-180 -76,-140" stroke="#8A909B" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M64,-230 Q84,-180 76,-140" stroke="#8A909B" stroke-width="30" fill="none" stroke-linecap="round"/><circle cx="-76" cy="-132" r="15" fill="${SK}" stroke="${K}" stroke-width="5"/><circle cx="76" cy="-132" r="15" fill="${SK}" stroke="${K}" stroke-width="5"/>`;
  // torso (hoodie, belly)
  g+=`<path d="M-62,-250 Q-92,-160 -58,-130 L58,-130 Q92,-160 62,-250 Q0,-266 -62,-250Z" fill="#8A909B" stroke="${K}" stroke-width="5"/>`;
  g+=`<path d="M-30,-190 q8,-10 18,-2 q10,8 2,16 q-14,6 -20,-14z" fill="#B5462E" opacity=".85"/>`; // stain
  g+=`<rect x="-34" y="-170" width="68" height="24" rx="8" fill="none" stroke="${K}" stroke-width="4"/>`; // pocket
  g+=ar;
  g+=head({x:0,y:-330,s:.62,t,...headOpt});
  return g+`</g>`;
}

/* ---------- ROOM ---------- */
function room(t,o={}){
  const fl=0.55+0.25*Math.sin(t*23)+0.15*Math.sin(t*7.3);
  let g=`<rect width="${W}" height="${H}" fill="#1D2546"/>`;
  g+=`<rect x="300" y="110" width="170" height="150" rx="6" fill="#0E1430" stroke="${K}" stroke-width="6"/><circle cx="420" cy="160" r="26" fill="#F3EFC8"/><path d="M385,110 L385,260 M300,185 L470,185" stroke="${K}" stroke-width="6"/>`;
  g+=`<rect x="70" y="140" width="110" height="140" rx="4" fill="#E24E62" stroke="${K}" stroke-width="5" transform="rotate(-6 125 210)"/><circle cx="125" cy="200" r="28" fill="${YEL}" stroke="${K}" stroke-width="4" transform="rotate(-6 125 210)"/>`;
  g+=`<rect y="640" width="${W}" height="${H-640}" fill="#2B2440"/>`;
  // TV glow
  g+=`<defs><radialGradient id="tvg"><stop offset="0" stop-color="#5AA9FF" stop-opacity="${0.55*fl}"/><stop offset="1" stop-color="#5AA9FF" stop-opacity="0"/></radialGradient></defs>`;
  g+=`<circle cx="70" cy="560" r="330" fill="url(#tvg)"/>`;
  g+=`<rect x="-10" y="470" width="120" height="90" rx="8" fill="#0B0F1E" stroke="${K}" stroke-width="6"/><rect x="2" y="482" width="96" height="66" fill="#6FB6FF" opacity="${0.6+0.4*fl}"/><rect x="20" y="560" width="60" height="80" fill="#3A2F55" stroke="${K}" stroke-width="5"/>`;
  // clock
  const cz=o.clockZoom||0;
  g+=`<g transform="translate(400,330) scale(${1+cz*0.9})"><rect x="-60" y="-26" width="120" height="52" rx="10" fill="#0B0F1E" stroke="${K}" stroke-width="5"/><text x="0" y="13" text-anchor="middle" font-family="JetBrains Mono" font-weight="800" font-size="34" fill="#FF4040">${o.clock||'02:13'}</text></g>`;
  // ventilator laundry
  g+=`<path d="M200,40 L200,90" stroke="${K}" stroke-width="5"/><circle cx="200" cy="96" r="12" fill="#555" stroke="${K}" stroke-width="4"/><path d="M180,98 Q170,140 150,150 L200,128Z" fill="#E7C35A" stroke="${K}" stroke-width="4"/>`;
  return g;
}
function clutter(){
  let g='';
  [[150,700,-10],[180,712,8],[430,820,20]].forEach(c=>g+=`<g transform="translate(${c[0]},${c[1]}) rotate(${c[2]})"><rect x="-12" y="-26" width="24" height="44" rx="5" fill="#2EE59D" stroke="${K}" stroke-width="4"/><rect x="-12" y="-8" width="24" height="10" fill="#111"/></g>`);
  g+=pizzaBox(80,850,-8);
  return g;
}
function pizzaBox(x,y,r,open=0){return `<g transform="translate(${x},${y}) rotate(${r})"><path d="M-70,-14 L70,-14 L76,14 L-76,14Z" fill="#D9A55B" stroke="${K}" stroke-width="5"/><path d="M-70,-14 L70,-14 L60,-24 L-60,-24Z" fill="#E8BD78" stroke="${K}" stroke-width="5"/><text x="0" y="8" text-anchor="middle" font-family="Inter" font-weight="900" font-size="14" fill="#B5462E">PIZZA</text></g>`}
function bed(){return `<rect x="120" y="560" width="400" height="150" rx="16" fill="#5B3B8C" stroke="${K}" stroke-width="6"/><rect x="430" y="470" width="40" height="240" rx="8" fill="#6B4A2E" stroke="${K}" stroke-width="6"/>`}

/* ---------- PHONE + FINGER ---------- */
const PH={x:95,y:120,w:350,h:720};
function phone(inner,o={}){
  const {sc=1,cx=270,cy=480}=o;
  return `<g transform="translate(${cx},${cy}) scale(${sc}) translate(${-cx},${-cy})">
  <defs><clipPath id="scr"><rect x="${PH.x+12}" y="${PH.y+12}" width="${PH.w-24}" height="${PH.h-24}" rx="38"/></clipPath></defs>
  <rect x="${PH.x}" y="${PH.y}" width="${PH.w}" height="${PH.h}" rx="50" fill="#0A0A0A" stroke="${K}" stroke-width="6"/>
  <g clip-path="url(#scr)">${inner}</g>
  <rect x="${PH.x+130}" y="${PH.y+22}" width="90" height="24" rx="12" fill="#000"/>
  </g>`;
}
function finger(x,y,press=0,rot=-14){
  const s=1-press*0.06;
  return `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">
   <path d="M-34,40 L-34,-4 Q-34,-40 0,-40 Q34,-40 34,-4 L38,700 L-44,700Z" fill="#E8B08A" stroke="${K}" stroke-width="6"/>
   <path d="M-20,-14 Q-20,-30 0,-30 Q20,-30 20,-14 L20,6 Q0,14 -20,6Z" fill="#F6D2BA" stroke="${K}" stroke-width="3"/>
   <path d="M-24,80 Q0,90 24,80 M-24,96 Q0,104 24,96" stroke="#B47B5A" stroke-width="4" fill="none"/>
   ${press>0.3?`<circle cx="0" cy="-40" r="${30+press*20}" fill="none" stroke="#fff" stroke-width="4" opacity="${1-press}"/>`:''}</g>`;
}
const SX=PH.x+12, SY=PH.y+12, SW=PH.w-24, SH=PH.h-24;

function storyBars(n,i,p){let g='';const w=(SW-30)/n;for(let k=0;k<n;k++){g+=`<rect x="${SX+12+k*w}" y="${SY+46}" width="${w-6}" height="5" rx="3" fill="rgba(255,255,255,.4)"/><rect x="${SX+12+k*w}" y="${SY+46}" width="${(w-6)*(k<i?1:k==i?p:0)}" height="5" rx="3" fill="#fff"/>`}return g}
function storyHeader(name,col){return `<circle cx="${SX+34}" cy="${SY+80}" r="16" fill="${col}" stroke="#fff" stroke-width="3"/><text x="${SX+58}" y="${SY+86}" font-family="Inter" font-weight="700" font-size="17" fill="#fff">${name}</text>`}

/* ---------- JÚLIA running (side view) ---------- */
function julia(x,y,s,t){
  const ph=t*11, l1=Math.sin(ph)*34, l2=-l1, bob=Math.abs(Math.sin(ph))*-8, pony=Math.sin(ph*0.5)*14;
  const leg=(a,c)=>{const kx=Math.sin(a*Math.PI/180)*40, ky=-60;const fx=kx+Math.sin((a-30)*Math.PI/180)*44, fy=ky+Math.cos(a*Math.PI/180)*50+10;
    return `<path d="M0,-110 L${kx},${ky} L${fx},${fy}" stroke="${c}" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="${fx+8}" cy="${fy+4}" rx="18" ry="9" fill="${PINK}" stroke="${K}" stroke-width="4"/>`};
  return `<g transform="translate(${x},${y+bob}) scale(${s})">
   ${leg(l2,'#B07850')}
   <path d="M-6,-200 Q-40,-160 -50,-130" stroke="#B07850" stroke-width="16" fill="none" stroke-linecap="round"/>
   ${leg(l1,'#C68A5E')}
   <path d="M-24,-215 Q-30,-150 -20,-110 L22,-110 Q30,-160 20,-215Z" fill="${PUR}" stroke="${K}" stroke-width="5"/>
   <rect x="-24" y="-120" width="46" height="26" rx="6" fill="#222" stroke="${K}" stroke-width="5"/>
   <path d="M6,-200 Q40,-170 46,-140" stroke="#C68A5E" stroke-width="16" fill="none" stroke-linecap="round"/>
   <path d="M-30,-262 Q-70,${-250+pony} -66,${-214+pony}" stroke="#3B2216" stroke-width="18" fill="none" stroke-linecap="round"/>
   <circle cx="0" cy="-250" r="34" fill="#C68A5E" stroke="${K}" stroke-width="5"/>
   <path d="M-34,-258 Q-20,-296 20,-284 Q30,-270 34,-256 L-34,-256Z" fill="#3B2216" stroke="${K}" stroke-width="4"/>
   <path d="M-30,-268 L44,-268 L56,-262 L-30,-260Z" fill="#fff" stroke="${K}" stroke-width="4"/>
   <circle cx="14" cy="-246" r="4" fill="${K}"/><path d="M8,-228 Q18,-222 26,-230" stroke="${K}" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>`;
}

/* ---------- speed lines ---------- */
function speedLines(t,col='#fff'){let g='';for(let i=0;i<40;i++){const a=i/40*Math.PI*2+t*0.6, r1=230+((i*53+Math.floor(t*20))%7)*12;g+=`<path d="M${270+Math.cos(a)*r1},${480+Math.sin(a)*r1} L${270+Math.cos(a)*700},${480+Math.sin(a)*700}" stroke="${col}" stroke-width="${3+(i%3)*3}" opacity=".7"/>`}return g}

/* ---------- CAPTIONS ---------- */
const LINES=[
 [0.3,3.0,"O *BETO TÁ ACORDADO ÀS ^DUAS ^DA ^MANHÃ…"],
 [6.0,9.0,"…VENDO A ~JÚLIA ACORDAR PRA !CORRER."],
 [11.0,13.0,"ELA VAI CORRER UMA !MARATONA."],
 [13.0,15.0,"EM ^30 ^DIAS."],
 [15.2,18.0,"O *BETO NÃO CORRE NEM PRO !ÔNIBUS."],
 [18.2,22.0,"E ACABOU DE !PROMETER QUE VAI CORRER ^TAMBÉM."],
 [22.2,25.0,"O ^AMIGO DELE ACHOU !ENGRAÇADO."],
 [25.2,28.0,"O *BETO ACHOU QUE ERA UM !DESAFIO."],
 [28.5,33.0,"AGORA ELE TEM ^30 ^DIAS…"],
 [33.0,36.0,"…E !ZERO CONDICIONAMENTO."],
 [36.3,40.0,"MAS TEM UMA COISA QUE ELE NUNCA TEVE ANTES…"],
 [40.2,42.0,"…UM *MOTIVO."],
];
const COL={'*':PUR,'^':YEL,'!':RED,'~':PINK};
function chunks(str){const w=str.split(' ');const out=[];let i=0;while(i<w.length){const n=(w.length-i===4)?2:Math.min(3,w.length-i);out.push(w.slice(i,i+n));i+=n}return out}
function caption(t,y){
  const el=document.getElementById('cap');
  el.style.top=y+'px';
  for(const [a,b,s] of LINES){ if(t>=a&&t<b){
    const ch=chunks(s), d=(b-a)/ch.length, k=Math.min(ch.length-1,Math.floor((t-a)/d)), lt=(t-a)-k*d;
    const sc=lerp(0.6,1,back(clamp(lt/0.18)));
    el.innerHTML=`<div style="transform:scale(${sc})">`+ch[k].map(w=>{const c=COL[w[0]];return c?`<span style="color:${c}">${w.slice(1)}</span>`:`<span>${w}</span>`}).join('')+`</div>`;
    return;}}
  el.innerHTML='';
}

/* ---------- SCENES ---------- */
function svgWrap(inner,shake=0,t=0){const dx=shake?Math.sin(t*90)*shake:0,dy=shake?Math.cos(t*77)*shake:0;return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><g transform="translate(${dx},${dy})">${inner}</g></svg>`}

function S1(t){ // 0-3 room
  const cz=io(prog(t,1.2,1.8))*(1-io(prog(t,2.4,2.9)));
  const z=1+t*0.03;
  let g=`<g transform="translate(270,480) scale(${z}) translate(-270,-480)">`+room(t,{clockZoom:cz})+bed();
  // Beto sitting in bed, blanket
  g+=body({x:300,y:700,s:.78,headOpt:{eyes:'normal',mouth:'flat',glow:1,look:-0.3,blink:(t%2.2<0.12)?1:0}});
  g+=`<path d="M120,620 Q300,590 520,610 L520,710 L120,710Z" fill="#7650B5" stroke="${K}" stroke-width="6"/>`;
  g+=`<rect x="342" y="470" width="40" height="70" rx="8" fill="#111" stroke="${K}" stroke-width="4"/><rect x="346" y="476" width="32" height="58" rx="5" fill="#BFE0FF"/>`;
  g+=clutter()+`</g>`;
  return svgWrap(g);
}
function S2(t){ // 3-6 stories swipe
  const cards=[['#FF9F43','🐱','gato.oficial'],['#2EC4B6','🍕','pizzaria_top'],['#5F27CD','😂','memes.br'],['#FF6B6B','🎮','gamerzao']];
  const i=Math.min(3,Math.floor(t/0.75)), lt=t-i*0.75, sw=out(clamp(lt/0.2));
  let inner=`<rect x="${SX}" y="${SY}" width="${SW}" height="${SH}" fill="#000"/>`;
  [i-1,i].forEach((k,j)=>{ if(k<0)return; const c=cards[k]; const off=j===0?-SW*sw:SW*(1-sw);
    inner+=`<g transform="translate(${off},0)"><rect x="${SX}" y="${SY}" width="${SW}" height="${SH}" fill="${c[0]}"/><text x="270" y="520" text-anchor="middle" font-size="150">${c[1]}</text>${storyBars(4,k,0.5)}${storyHeader(c[2],'#fff')}</g>`;});
  const fx=lerp(400,200,io(clamp(lt/0.3))), press=lt<0.12?1-lt/0.12:0;
  return svgWrap(`<rect width="${W}" height="${H}" fill="#151A30"/>`+phone(inner)+finger(fx,640,press,-10));
}
function juliaStory(t,zoomText=0){
